<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWG-LU // CTF Session Manager v3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --phosphor: #00ff41;
    --phosphor-dim: #008f11;
    --phosphor-deep: #005f0a;
    --amber: #ffb000;
    --alarm: #ff003c;
    --cyan-ghost: rgba(0, 255, 255, 0.4);
    --red-ghost: rgba(255, 0, 60, 0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    height: 100%;
  }

  body {
    margin: 0;
    font-family: 'JetBrains Mono', ui-monospace, 'Menlo', 'Consolas', monospace;
    color: var(--phosphor);
    line-height: 1.6;
    padding: 32px 16px;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.18) 0,
      rgba(0, 0, 0, 0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 100;
    will-change: transform;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    box-shadow:
      inset 0 0 220px rgba(0, 0, 0, 0.85),
      inset 0 0 60px rgba(0, 40, 10, 0.25);
    pointer-events: none;
    z-index: 99;
  }

  @media (prefers-reduced-motion: no-preference) {
    body { animation: flicker 0.15s infinite; }
    body::after { animation: scanDrift 8s linear infinite; }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.97; }
    }
    @keyframes scanDrift {
      0% { transform: translateY(0); }
      100% { transform: translateY(3px); }
    }
  }

  .wrap {
    width: 100%;
    max-width: 720px;
    position: relative;
    z-index: 1;
  }

  pre.header {
    color: var(--phosphor);
    white-space: pre;
    font-size: 13px;
    line-height: 1.35;
    margin: 0 0 26px;
    overflow-x: auto;
    text-shadow:
      0 0 2px var(--phosphor),
      0 0 6px rgba(0, 255, 65, 0.35);
  }

  .boot {
    color: var(--phosphor-dim);
    font-size: 12.5px;
    line-height: 1.7;
    margin: 0 0 24px;
  }

  .boot .amber { color: var(--amber); }
  .boot .ok    { color: var(--phosphor); }
  .boot .warn  { color: var(--alarm); }

  .cursor {
    display: inline-block;
    width: 0.6em;
    color: var(--phosphor);
    text-shadow: 0 0 4px var(--phosphor);
  }
  @media (prefers-reduced-motion: no-preference) {
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink {
      0%, 50%   { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  }

  .err-box {
    display: none;
    margin-top: 14px;
    padding: 10px 14px;
    border: 1px solid var(--alarm);
    color: var(--alarm);
    font-size: 13px;
  }
  .err-box.show { display: block; }

  #fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease-in;
    z-index: 500;
  }
  #fade.on { opacity: 1; pointer-events: auto; }

  ::selection { background: var(--phosphor); color: #000; }
</style>
</head>
<body>

<div class="wrap" id="shell">
<pre class="header">╔═══════════════════════════════════════╗
║  HWG-LU // CTF SESSION MANAGER v3.0   ║
╚═══════════════════════════════════════╝</pre>

<div class="boot" id="boot">
<span class="amber">[boot]</span> initializing session shell<span class="cursor">▊</span>
</div>

<div class="err-box" id="err"></div>

</div><!-- /.wrap -->

<div id="fade"></div>

<script>
"use strict";

// ------------------------------------------------------------------
// v3: kein Matrikel-Prompt mehr. Session-Cookie kommt vom Server.
// Ablauf: kurze Boot-Sequenz → /api/flags fetchen → challenge.html
// mit Placeholders substituieren → in place rendern.
// ------------------------------------------------------------------
const $boot = document.getElementById("boot");
const $err  = document.getElementById("err");
const $fade = document.getElementById("fade");
const noMotion = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ------------------------------------------------------------------
// Optional: ?logout=1 löscht den localStorage-Cache (Session-Cookie
// selbst ist HttpOnly und kann von JS nicht gelöscht werden — muss
// per Browser oder DevTools rausgeputzt werden).
// ------------------------------------------------------------------
(function maybeClearCache() {
  const params = new URLSearchParams(location.search);
  if (params.has("logout")) {
    try { localStorage.removeItem("ctf2:placeholders"); } catch {}
    history.replaceState({}, "", location.pathname);
  }
})();

// ------------------------------------------------------------------
// Boot-Sequenz + Fetch parallel
// ------------------------------------------------------------------
(async function boot() {
  const bootLines = [
    { text: "[+] crypto module          ok", cls: "ok" },
    { text: "[+] flag oracle            online", cls: "ok" },
    { text: "[+] session cookie         reading...", cls: "amber" },
    { text: "[+] tls handshake          ok", cls: "ok" },
    { text: "[+] loading exploit chain  ok", cls: "ok" },
  ];

  // Fetch startet SOFORT (parallel zur Boot-Animation)
  const fetchPromise = fetch("/api/flags", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: "{}",
  });

  await typewriteLines(bootLines, /*totalMs=*/700);

  let resp, data;
  try {
    resp = await fetchPromise;
    data = await resp.json();
  } catch (e) {
    showErr("[-] network error :: " + e.message);
    return;
  }

  if (!resp.ok || !data.ok) {
    showErr("[-] oracle rejected request :: "
      + (data && data.error ? data.error : ("http " + resp.status)));
    return;
  }

  appendLog("[+] session id             " + data.session_id, "ok");
  appendLog("[+] session ts             " + data.unix_ts, "ok");
  appendLog("[+] delivering personalized payload...", "amber");
  await sleep(200);

  try { localStorage.setItem("ctf2:placeholders", JSON.stringify(data.placeholders)); }
  catch {}

  await fadeOut();
  await renderChallenge(data.placeholders);
})();

// ------------------------------------------------------------------
// Challenge renderer
// ------------------------------------------------------------------
async function renderChallenge(placeholders) {
  let template;
  try {
    const r = await fetch("/challenge.html", { cache: "no-store" });
    if (!r.ok) throw new Error("challenge.html http " + r.status);
    template = await r.text();
  } catch (e) {
    document.body.innerHTML = "";
    document.body.style.color = "#ff003c";
    document.body.textContent = "[fatal] failed to load challenge: " + e.message;
    return;
  }
  const html = substituteAll(template, placeholders);
  // document.open/write/close ist der einzige zuverlässige Weg,
  // ein komplettes HTML-Dokument inkl. inline-<script>s zu ersetzen.
  document.open("text/html", "replace");
  document.write(html);
  document.close();
}

function substituteAll(template, placeholders) {
  return template.replace(/\{\{([A-Z0-9_]+)\}\}/g, (m, k) => {
    if (Object.prototype.hasOwnProperty.call(placeholders, k)) {
      return placeholders[k];
    }
    return m;
  });
}

// ------------------------------------------------------------------
// UI helpers
// ------------------------------------------------------------------
function appendLog(text, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = text;
  $boot.appendChild(line);
}

async function typewriteLines(lines, totalMs) {
  if (noMotion) {
    for (const l of lines) appendLog(l.text, l.cls);
    return;
  }
  const per = Math.max(90, Math.floor(totalMs / lines.length));
  for (const l of lines) {
    appendLog(l.text, l.cls);
    await sleep(per);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showErr(msg) {
  $err.textContent = msg;
  $err.classList.add("show");
}

async function fadeOut() {
  if (noMotion) return;
  $fade.classList.add("on");
  await sleep(420);
}
</script>

</body>
</html>
